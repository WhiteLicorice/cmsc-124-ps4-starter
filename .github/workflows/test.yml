name: ps4-checks
on: [push]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The only setup action for SWI-Prolog supports Linux alone, so each
      # runner installs it with a shell step, the way the manual has students
      # do. Ubuntu's package is the 9.0 series and the other two are 10.0. The
      # grader re-derives every published expectation before it scores, so a
      # build that printed one answer differently would stop the run and
      # say so.
      - name: Install SWI-Prolog (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox

      - name: Install SWI-Prolog (macOS)
        if: runner.os == 'macOS'
        run: brew install swi-prolog

      # The same installer winget fetches for students, run without its
      # dialog. It does not add itself to PATH, so the last line adds it.
      - name: Install SWI-Prolog (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://www.swi-prolog.org/download/stable/bin/swipl-10.0.2-1.x64.exe"
          curl.exe -sSL -o "$env:RUNNER_TEMP\swipl-setup.exe" $url
          Start-Process -FilePath "$env:RUNNER_TEMP\swipl-setup.exe" -ArgumentList "/S" -Wait
          "C:\Program Files\swipl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Report the version this runner grades with
        run: swipl --version
        shell: bash

      - run: chmod +x run check.sh lint trace
        shell: bash

      - run: ./run P01
        shell: bash

      - run: ./trace P07
        shell: bash

      - run: ./check.sh
        shell: bash
